name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test
      - run: uv run --no-sync python -m pytest -q
      - name: Complete prompt wording games
        run: uv run --no-sync python tools/test_prompt_games.py "$RUNNER_TEMP/overfished-prompts"
      - name: Production source wording comparisons
        run: uv run --no-sync python tools/test_source_prompts.py "$RUNNER_TEMP/overfished-source-prompts"
