name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test
      - run: uv run --no-sync python -m pytest -q
      - name: Production teacher complete episodes
        run: |
          uv run --no-sync python -m tools.export_posttrain "$RUNNER_TEMP/overfished-teacher" --variant pond --games 10 \
            --soul souls/steady.md --soul souls/greedy.md --soul souls/enforcer.md --soul souls/steady.md
