[project]
name = "overfished"
version = "0.1.0"
description = "Overfished: a soul.md commons game for Coworld. Eight fishers, one lake, a hidden population model, and a council every five turns."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.10",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
overfished = "overfished.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
